server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.php;

    # Bloquea acceso a archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Sirve archivos estáticos
    location / {
        try_files $uri $uri/ =404;
    }

    # 🔸 BLOQUE PHP: Comentado hasta activar el perfil backend
    # Cuando actives --profile backend, descomenta estas líneas:
