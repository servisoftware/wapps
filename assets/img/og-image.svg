<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBFBF8"/>
      <stop offset="100%" stop-color="#F5F2E9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cream)"/>
  <circle cx="1280" cy="-80" r="500" fill="#F4A261" opacity="0.10"/>
  <circle cx="-100" cy="700" r="350" fill="#1B4965" opacity="0.05"/>

  <!-- Wordmark + aclaración "Web Applications" -->
  <text x="80" y="130" font-family="Fraunces" font-size="60" font-weight="500" fill="#1B4965">wapps<tspan fill="#F4A261">.</tspan></text>
  <text x="82" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#5C6975" letter-spacing="4">WEB APPLICATIONS</text>

  <!-- Eyebrow -->
  <text x="80" y="245" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#BA7517" letter-spacing="3">CALCULADORAS Y HERRAMIENTAS WEB</text>

  <!-- Tagline gigante (reducido a 52px para no chocar con la card) -->
  <text x="80" y="320" font-family="Fraunces" font-size="52" font-weight="500" fill="#1A2332">Las cuentas de tu negocio,</text>
  <text x="80" y="395" font-family="Fraunces" font-size="52" font-weight="500" font-style="italic" fill="#1B4965">claras y rápidas.</text>

  <!-- Línea ámbar decorativa -->
  <rect x="80" y="460" width="90" height="5" fill="#F4A261" rx="2"/>

  <!-- Subtítulo nuevo: el eslogan de Andrés -->
  <text x="80" y="515" font-family="Fraunces" font-size="24" font-style="italic" fill="#5C6975">Pequeñas apps, grandes soluciones.</text>

  <!-- URL -->
  <text x="80" y="568" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1B4965" font-weight="700">wapps.servisoftware.com</text>

  <!-- Preview card de calculadora (movida a x=800, ancho 340 para dejar espacio al tagline) -->
  <g transform="translate(800, 145)">
    <rect width="340" height="340" rx="16" fill="#FFFFFF" stroke="#E8E5DD" stroke-width="1"/>
    <rect x="28" y="-4" width="60" height="6" fill="#F4A261" rx="3"/>

    <rect x="28" y="32" width="100" height="26" rx="13" fill="#E8EFF5"/>
    <text x="78" y="50" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1B4965" letter-spacing="1.5" text-anchor="middle">TRIBUTARIA</text>

    <text x="28" y="108" font-family="Fraunces" font-size="24" font-weight="500" fill="#1A2332">Calculadora de IVA</text>

    <line x1="28" y1="135" x2="312" y2="135" stroke="#E8E5DD"/>
    <text x="28" y="168" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5C6975">Precio sin IVA</text>
    <text x="312" y="168" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1A2332" text-anchor="end">$200.000</text>

    <line x1="28" y1="192" x2="312" y2="192" stroke="#E8E5DD"/>
    <text x="28" y="223" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5C6975">IVA (19%)</text>
    <text x="312" y="223" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#BA7517" text-anchor="end">$38.000</text>

    <rect x="28" y="250" width="284" height="76" rx="8" fill="#F1EFE8"/>
    <text x="44" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5C6975" letter-spacing="0.5">Total con IVA</text>
    <text x="296" y="308" font-family="Fraunces" font-size="30" font-weight="500" fill="#1B4965" text-anchor="end">$238.000</text>
  </g>
</svg>
